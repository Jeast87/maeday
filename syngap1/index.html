<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNGAP1: From Brain to Atom</title>
<style>
  :root{
    --level-color: #7c3aed;
    --level-color-soft: #7c3aed22;
    --bg-1: #0f0b1e;
    --bg-2: #1a1330;
    --panel: #ffffff;
    --ink: #1c1730;
    --ink-soft: #5b5470;
    --line: #e8e4f5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 15% -10%, var(--level-color-soft), transparent),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-repeat: no-repeat;
    color: var(--ink);
    min-height: 100vh;
    transition: background 0.6s ease;
  }
  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  /* Header */
  header.top{
    text-align:center;
    color:#fff;
    margin-bottom: 22px;
  }
  header.top h1{
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    margin: 0 0 6px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  header.top p{
    margin: 0;
    color: #cfc9e6;
    font-size: 0.98rem;
  }

  /* Mode toggle (Family guide vs Research view) */
  .modeToggle{
    display:flex;
    justify-content:center;
    gap:2px;
    margin: 0 auto 22px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 4px;
    width: fit-content;
    max-width: 100%;
  }
  .modeToggle button{
    background:none;
    border:none;
    color:#cfc9e6;
    font: inherit;
    font-weight:700;
    font-size: 0.82rem;
    padding: 9px 16px;
    border-radius: 999px;
    cursor:pointer;
    transition: all 0.2s ease;
    white-space:nowrap;
  }
  .modeToggle button:hover{ color:#fff; }
  .modeToggle button.active{
    background:#fff;
    color:#14101f;
    box-shadow: 0 6px 16px -6px rgba(0,0,0,0.4);
  }
  @media (max-width:480px){
    .modeToggle button{ font-size:0.72rem; padding:8px 11px; }
  }

  /* Level map / progress ladder */
  .levelmap{
    display:flex;
    justify-content:center;
    gap: 6px;
    margin: 22px auto 18px;
    flex-wrap: wrap;
    max-width: 900px;
  }
  .levelmap button{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 10px;
    cursor:pointer;
    color:#cfc9e6;
    font-size: 0.68rem;
    font-weight:600;
    transition: all 0.2s ease;
    min-width: 72px;
  }
  .levelmap button .ic{ font-size:1.15rem; line-height:1; }
  .levelmap button:hover{ background: rgba(255,255,255,0.14); transform: translateY(-1px); }
  .levelmap button.active{
    background: var(--level-color);
    border-color: var(--level-color);
    color:#fff;
    box-shadow: 0 6px 18px -6px var(--level-color);
  }
  .levelmap button.done{ color:#fff; }
  .levelmap button:disabled{ cursor:not-allowed; opacity:0.55; }
  .levelmap .connector{
    align-self:center;
    color: rgba(255,255,255,0.25);
    font-size: 0.8rem;
  }

  /* Breadcrumb */
  .crumbs{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
    color:#cfc9e6;
    font-size:0.82rem;
    margin: 0 auto 18px;
    max-width: 900px;
    justify-content:center;
  }
  .crumbs button{
    background:none;
    border:none;
    color:#cfc9e6;
    font: inherit;
    cursor:pointer;
    padding: 2px 4px;
    border-radius: 6px;
  }
  .crumbs button:hover{ color:#fff; text-decoration: underline; }
  .crumbs button.current{ color:#fff; font-weight:700; text-decoration:none; cursor:default; }
  .crumbs .sep{ opacity:0.4; }

  /* 3D viewer */
  .viewer-wrap{
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    background: radial-gradient(600px 400px at 30% 20%, var(--level-color-soft), transparent), linear-gradient(160deg, #0c0a18, #171227);
    box-shadow: 0 30px 60px -22px rgba(0,0,0,0.55);
    height: min(56vw, 440px);
    min-height: 260px;
    margin-bottom: 16px;
    transition: background 0.6s ease;
    animation: rise 0.45s ease;
  }
  .viewer-host{ position:absolute; inset:0; }
  .viewer-host canvas{ display:block; width:100%; height:100%; touch-action:none; }
  .viewer-labels{ position:absolute; inset:0; pointer-events:none; }
  .viewer-label{
    position:absolute; left:0; top:0;
    background: rgba(10,8,20,0.72);
    color:#fff;
    font-size: 0.72rem;
    font-weight:700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space:nowrap;
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(2px);
  }
  .viewer-topbar{
    position:absolute; top:12px; left:14px; right:14px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
    z-index:3;
  }
  .viewer-badge{
    background: rgba(255,255,255,0.1);
    color:#fff;
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .viewer-instructions{
    position:absolute; left:14px; bottom:12px;
    color: rgba(255,255,255,0.78);
    font-size: 0.72rem;
    background: rgba(10,8,20,0.5);
    padding: 5px 10px;
    border-radius: 999px;
    pointer-events:none;
    z-index:3;
  }
  .viewer-controls{
    position:absolute; right:12px; bottom:12px;
    display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;
    max-width: 60%;
    z-index:4;
  }
  .viewer-controls .vc-btn{
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.22);
    color:#fff;
    font: inherit;
    font-size: 0.72rem;
    font-weight:700;
    padding: 6px 11px;
    border-radius: 999px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .viewer-controls .vc-btn:hover{ background: rgba(255,255,255,0.22); }
  .viewer-controls .vc-btn.active{
    background: #fff;
    color: #14101f;
  }
  .viewer-controls .vc-toggle{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.22);
    padding: 6px 12px;
    border-radius: 999px;
    cursor:pointer;
    color:#fff;
    font-size:0.72rem;
    font-weight:700;
  }
  .vc-toggle .dot{
    width:32px; height:18px; border-radius:999px;
    background: rgba(255,255,255,0.25);
    position:relative;
    transition: background 0.2s ease;
    flex-shrink:0;
  }
  .vc-toggle .dot::after{
    content:"";
    position:absolute; top:2px; left:2px;
    width:14px; height:14px; border-radius:50%;
    background:#fff;
    transition: transform 0.2s ease;
  }
  .vc-toggle.on .dot{ background:#ef4444; }
  .vc-toggle.on .dot::after{ transform: translateX(14px); }

  .viewer-loading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color: rgba(255,255,255,0.65);
    font-size:0.85rem;
    z-index:2;
  }
  .viewer-fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    color: rgba(255,255,255,0.7);
    font-size:0.82rem;
    text-align:center;
    padding: 20px;
  }
  .viewer-fallback .big{ font-size:2.4rem; }

  /* --- Layman / research mode switching for the viewer --- */
  .viewer2d{
    display:none;
    position:absolute; inset:0;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap: 10px;
    padding: 20px;
    cursor:default;
  }
  .viewer2d svg{ display:block; max-width:min(78%, 340px); max-height:70%; overflow:visible; }
  .viewer2d .v2d-caption{
    color:#e4defc;
    font-size:0.82rem;
    font-weight:600;
    text-align:center;
    max-width: 420px;
    line-height:1.45;
  }
  .viewer2d .v2d-hint{
    position:absolute; left:14px; bottom:12px;
    color: rgba(255,255,255,0.78);
    font-size: 0.72rem;
    background: rgba(10,8,20,0.5);
    padding: 5px 10px;
    border-radius: 999px;
    z-index:3;
  }
  .viewer2d.clickable{ cursor:pointer; }

  .viewer-wrap.mode-layman .viewer-host,
  .viewer-wrap.mode-layman .viewer-labels,
  .viewer-wrap.mode-layman .viewer-controls,
  .viewer-wrap.mode-layman .viewer-instructions,
  .viewer-wrap.mode-layman .viewer-loading,
  .viewer-wrap.mode-layman #viewerBadge{
    display:none !important;
  }
  .viewer-wrap.mode-layman .viewer2d{ display:flex; }

  /* Illustration animations */
  @keyframes v2dPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.06); opacity:0.88; } }
  @keyframes v2dGlow{ 0%,100%{ opacity:0.35; } 50%{ opacity:0.75; } }
  @keyframes v2dBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  @keyframes v2dWireTravel{ 0%{ offset-distance:0%; opacity:0; } 8%{ opacity:1; } 92%{ opacity:1; } 100%{ offset-distance:100%; opacity:0; } }
  @keyframes v2dRing{ 0%{ transform:scale(0.6); opacity:0.9; } 100%{ transform:scale(1.9); opacity:0; } }
  @keyframes v2dTalk{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  @keyframes v2dNote{ 0%{ transform:translateX(0) scale(0.6); opacity:0; } 15%{ opacity:1; } 50%{ transform:translateX(38px) scale(1); opacity:1; } 85%{ opacity:1; } 100%{ transform:translateX(76px) scale(0.6); opacity:0; } }
  @keyframes v2dPress{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(-16deg); } }
  @keyframes v2dSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes v2dSpinRev{ from{ transform:rotate(360deg); } to{ transform:rotate(0deg); } }
  @keyframes v2dShimmer{ 0%,100%{ opacity:0.85; } 50%{ opacity:1; transform:scale(1.08); } }

  /* Main card */
  .card{
    background: var(--panel);
    border-radius: 22px;
    padding: clamp(20px, 4vw, 40px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.45);
    animation: rise 0.45s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(14px) scale(0.99); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .card-head{
    display:flex;
    align-items:flex-start;
    gap:16px;
    margin-bottom: 6px;
  }
  .card-head .icon{
    font-size: 2.4rem;
    line-height:1;
    background: var(--level-color-soft);
    border-radius: 16px;
    padding: 10px 12px;
    flex-shrink:0;
  }
  .card-head h2{
    margin:0 0 4px;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .card-head .tagline{
    margin:0;
    color: var(--level-color);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .level-pill{
    display:inline-block;
    font-size: 0.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing: 0.06em;
    color: var(--level-color);
    background: var(--level-color-soft);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .summary{
    font-size: 1.05rem;
    line-height:1.6;
    color: var(--ink);
    margin: 18px 0 22px;
    padding: 16px 18px;
    background: #faf9ff;
    border-left: 4px solid var(--level-color);
    border-radius: 10px;
  }

  .factbox{
    margin: 22px 0;
  }
  .factbox h3, .sections h3, .citebox h3{
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin: 0 0 12px;
    font-weight: 800;
  }
  .factbox ul{
    margin:0;
    padding:0;
    list-style:none;
    display:grid;
    gap:10px;
  }
  .factbox li{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size: 0.95rem;
    line-height:1.5;
    color: var(--ink);
  }
  .factbox li::before{
    content:"";
    width:8px;height:8px;
    border-radius:50%;
    background: var(--level-color);
    margin-top:7px;
    flex-shrink:0;
  }

  .sections{ margin: 26px 0; }
  .sections .sec{ margin-bottom: 18px; }
  .sections .sec h4{
    margin: 0 0 6px;
    font-size: 1.02rem;
    color: var(--ink);
  }
  .sections .sec p{
    margin:0;
    color: var(--ink-soft);
    line-height:1.65;
    font-size: 0.96rem;
  }

  .citebox{
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .citebox ol{
    margin:0;
    padding-left: 1.1em;
    display:grid;
    gap:8px;
  }
  .citebox li{
    font-size: 0.88rem;
    color: var(--ink-soft);
    line-height:1.5;
  }
  .citebox a{
    color: var(--level-color);
    text-decoration:none;
    font-weight:600;
  }
  .citebox a:hover{ text-decoration:underline; }

  .navrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .navbtn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:none;
    cursor:pointer;
    font: inherit;
    font-weight:700;
    font-size: 0.92rem;
    padding: 12px 18px;
    border-radius: 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .navbtn:active{ transform: scale(0.97); }
  .navbtn.prev{
    background: #f2effc;
    color: var(--ink);
  }
  .navbtn.prev:hover{ background:#e8e3f9; }
  .navbtn.next{
    background: var(--level-color);
    color:#fff;
    box-shadow: 0 10px 24px -10px var(--level-color);
    margin-left:auto;
  }
  .navbtn.next:hover{ filter: brightness(1.08); }
  .navbtn:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; }
  .navbtn .arrow{ transition: transform 0.15s ease; }
  .navbtn.next:hover .arrow{ transform: translateX(3px); }
  .navbtn.prev:hover .arrow{ transform: translateX(-3px); }

  .zoomhint{
    text-align:center;
    color:#a89fd4;
    font-size:0.78rem;
    margin-top: 10px;
  }

  footer.app-footer{
    max-width: 900px;
    margin: 30px auto 0;
    color: #a89fd4;
    font-size: 0.78rem;
    text-align:center;
    line-height:1.6;
  }
  footer.app-footer strong{ color:#cfc9e6; }

  @media (max-width: 640px){
    .levelmap button{ min-width: 58px; padding:6px 7px; font-size:0.6rem;}
    .card-head{ flex-direction:column; }
    .viewer-controls{ max-width: 100%; left:12px; right:12px; justify-content:flex-start; bottom:auto; top:52px; }
    .viewer-instructions{ display:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>SYNGAP1: From Brain to Atom</h1>
      <p id="headerSub">A simple, illustrated guide to SYNGAP1-Related Disorder — explore step by step, from the whole brain down to the tiny building blocks involved.</p>
    </header>

    <div class="modeToggle" id="modeToggle" role="group" aria-label="Explanation depth">
      <button type="button" class="active" data-mode="layman">👪 For Families</button>
      <button type="button" data-mode="research">🔬 For Researchers</button>
    </div>

    <nav class="levelmap" id="levelmap" aria-label="Level navigator"></nav>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

    <div class="viewer-wrap mode-layman" id="viewerWrap">
      <div class="viewer-host" id="viewerHost"></div>
      <div class="viewer-labels" id="viewerLabels"></div>
      <div class="viewer-topbar">
        <span class="viewer-badge" id="viewerBadge">3D</span>
        <span></span>
      </div>
      <div class="viewer-controls" id="viewerControls"></div>
      <div class="viewer-instructions" id="viewerInstructions">🖱️ Drag to rotate • Scroll to zoom • Click the glowing marker to zoom in</div>
      <div class="viewer-loading" id="viewerLoading">Loading 3D view…</div>
      <div class="viewer2d" id="viewer2d"></div>
    </div>

    <main class="card" id="card">
      <p style="color:#888;">Loading…</p>
    </main>

    <footer class="app-footer" id="footer"></footer>
  </div>

      '<path d="M118,80 C136,72 152,75 168,63" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.35" style="animation:v2dGlow 2s ease-in-out infinite 0.3s;"/>' +
      '<circle cx="168" cy="40" r="6" fill="#fff" style="animation:v2dPulse 1.6s ease-in-out infinite;"/>' +
      '</svg>';
  },
  'amino-acid': function(color){
    var pts = [[15,52],[45,30],[75,46],[105,60],[135,46],[165,30],[195,52]];
    var beads = '';
    pts.forEach(function(p, i){
      var op = 0.65 + 0.35*(i%3===0?1:0.6);
      beads += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="13" fill="'+color+'" opacity="'+op.toFixed(2)+'" ' +
        'style="animation:v2dShimmer 2.4s ease-in-out infinite '+(i*0.22).toFixed(2)+'s;"/>';
    });
    return '<svg viewBox="0 0 210 90" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M15,52 Q45,20 75,46 T135,46 T195,52" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>' +
      beads +
      '</svg>';
  },
  elements: function(color){
    function ring(rot, cls, rev){
      return '<g transform="rotate('+rot+' 100 100)"><g style="transform-origin:100px 100px; animation:'+(rev?'v2dSpinRev':'v2dSpin')+' '+cls+'s linear infinite;">' +
        '<ellipse cx="100" cy="100" rx="82" ry="32" fill="none" stroke="'+color+'" stroke-width="2.5" opacity="0.45"/>' +
        '<circle cx="182" cy="100" r="6" fill="#fff" opacity="0.9"/>' +
        '</g></g>';
    }
    return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' +
      ring(0, 7, false) + ring(60, 9, true) + ring(120, 11, false) +
      '<circle cx="100" cy="100" r="14" fill="'+color+'" style="animation:v2dPulse 2.4s ease-in-out infinite;"/>' +
      '</svg>';
  }
};

function renderIllustration(level){
  if(!viewer2dEl) return;
  var m = level.model3d || {};
  var builder = ILLUS[m.type];
  var svg = builder ? builder(level.color) : '';
  var caption = level.laymanCaption || '';
  var hint = level.childId ? 'Tap the picture (or the button below) to continue →' : 'You\'ve reached the smallest scale — nice work! ⚛️';
  viewer2dEl.innerHTML = svg + (caption ? '<div class="v2d-caption">' + escapeHtml(caption) + '</div>' : '') +
    '<div class="v2d-hint">' + escapeHtml(hint) + '</div>';
  viewer2dEl.classList.toggle('clickable', !!level.childId);
  viewer2dEl.onclick = function(){ if(level.childId){ goTo(current+1); } };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderLevelMap(){
  levelmapEl.innerHTML = '';
  levels.forEach(function(l, i){
    if(i > 0){
      var conn = document.createElement('span');
      conn.className = 'connector';
      conn.textContent = '→';
      levelmapEl.appendChild(conn);
    }
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'level' + (i === current ? ' active' : '') + (i <= maxSeen ? ' done' : '');
    btn.innerHTML = '<span class="ic">' + l.icon + '</span><span>' + escapeHtml(l.shortName) + '</span>';
    btn.disabled = i > maxSeen;
    btn.addEventListener('click', function(){ goTo(i); });
    levelmapEl.appendChild(btn);
  });
}

function renderCrumbs(){
  crumbsEl.innerHTML = '';
  for(var i=0;i<=current;i++){
    if(i>0){
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      crumbsEl.appendChild(sep);
    }
    var l = levels[i];
    var btn = document.createElement('button');
    btn.type = 'button';
    if(i === current){
      btn.className = 'current';
      btn.textContent = l.name;
      btn.disabled = true;
    } else {
      btn.textContent = l.name;
      btn.addEventListener('click', function(idx){ return function(){ goTo(idx); }; }(i));
    }
    crumbsEl.appendChild(btn);
  }
}

function renderCard(){
  var l = levels[current];
  var isLayman = mode === 'layman';
  document.documentElement.style.setProperty('--level-color', l.color);
  document.documentElement.style.setProperty('--level-color-soft', l.color + '1f');

  var tagline = (isLayman && l.laymanTagline) ? l.laymanTagline : l.tagline;
  var summary = (isLayman && l.laymanSummary) ? l.laymanSummary : l.summary;
  var facts = (isLayman && l.laymanFacts && l.laymanFacts.length) ? l.laymanFacts : l.facts;

  var html = '';
  html += '<div class="level-pill">Level ' + (current+1) + ' of ' + levels.length + '</div>';
  html += '<div class="card-head">';
  html += '  <div class="icon">' + l.icon + '</div>';
  html += '  <div><h2>' + escapeHtml(l.name) + '</h2><p class="tagline">' + escapeHtml(tagline) + '</p></div>';
  html += '</div>';

  html += '<p class="summary">' + escapeHtml(summary) + '</p>';

  if(!isLayman && l.model3d && l.model3d.note){
    html += '<p style="font-size:0.78rem;color:var(--ink-soft);margin:-14px 0 20px;font-style:italic;">Note on the 3D model: ' + escapeHtml(l.model3d.note) + '</p>';
  }

  if(facts && facts.length){
    html += '<div class="factbox"><h3>' + (isLayman ? 'In plain language' : 'Quick facts') + '</h3><ul>';
    facts.forEach(function(f){ html += '<li>' + escapeHtml(f) + '</li>'; });
    html += '</ul></div>';
  }

  if(!isLayman && l.sections && l.sections.length){
    html += '<div class="sections"><h3>The research</h3>';
    l.sections.forEach(function(s){
      html += '<div class="sec"><h4>' + escapeHtml(s.heading) + '</h4><p>' + escapeHtml(s.text) + '</p></div>';
    });
    html += '</div>';
  }

  if(isLayman && l.sections && l.sections.length){
    html += '<p style="font-size:0.85rem;color:var(--ink-soft);margin:18px 0;">Want the full research write-up? Switch to <strong>🔬 For Researchers</strong> above.</p>';
  }

  if(l.citations && l.citations.length){
    html += '<div class="citebox"><h3>Published sources</h3><ol>';
    l.citations.forEach(function(c){
      html += '<li><a href="' + escapeHtml(c.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(c.title) + '</a></li>';
    });
    html += '</ol></div>';
  }

  html += '<div class="navrow">';
  html += '<button class="navbtn prev" id="prevBtn" ' + (current===0?'disabled':'') + '><span class="arrow">←</span> Back up</button>';
  if(l.childId){
    html += '<button class="navbtn next" id="nextBtn">Zoom into ' + escapeHtml(byId[l.childId].shortName) + ' <span class="arrow">→</span></button>';
  } else {
    html += '<span style="color:#a89fd4; font-weight:600; font-size:0.85rem; margin-left:auto;">You\'ve reached the smallest scale ⚛️</span>';
  }
  html += '</div>';
  html += '<p class="zoomhint">' + (isLayman
    ? 'Tap the picture above, use the level map, the breadcrumb, or ← / → arrow keys to navigate.'
    : 'Click the 3D model above, use the level map, the breadcrumb, or ← / → arrow keys to navigate.') + '</p>';

  cardEl.innerHTML = html;

  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  if(prevBtn) prevBtn.addEventListener('click', function(){ goTo(current-1); });
  if(nextBtn) nextBtn.addEventListener('click', function(){ goTo(current+1); });

  if(!isFirstRender){
    document.getElementById('viewerWrap').scrollIntoView({behavior:'smooth', block:'start'});
  }
  isFirstRender = false;
}

function renderFooter(){
  var meta = DATA.meta || {};
  footerEl.innerHTML = '<strong>' + escapeHtml(meta.title||'') + '</strong> — ' + escapeHtml(meta.disclaimer||'') +
    (meta.lastUpdated ? ' <br>Last updated ' + escapeHtml(meta.lastUpdated) : '');
}

function goTo(i){
  if(i < 0 || i >= levels.length) return;
  current = i;
  if(i > maxSeen) maxSeen = i;
  renderLevelMap();
  renderCrumbs();
  renderCard();
  renderIllustration(levels[current]);
  Viewer3D.loadLevel(levels[current]);
}

document.addEventListener('keydown', function(e){
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'ArrowRight'){ goTo(current+1); }
  if(e.key === 'ArrowLeft'){ goTo(current-1); }
});

/* ---------------- mode toggle (For Families vs For Researchers) ---------------- */

function setMode(newMode){
  if(mode === newMode) return;
  mode = newMode;
  if(modeToggleEl){
    Array.prototype.forEach.call(modeToggleEl.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.getAttribute('data-mode') === mode);
    });
  }
  if(viewerWrapEl){ viewerWrapEl.classList.toggle('mode-layman', mode === 'layman'); }
  if(headerSubEl){ headerSubEl.textContent = HEADER_SUB[mode]; }
  renderCard();
}

if(modeToggleEl){
  Array.prototype.forEach.call(modeToggleEl.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); });
  });
}

/* =======================================================================
   Viewer3D — a small Three.js engine that hosts one procedural, rotatable
   "scene" per level. Every scene exposes: group (THREE.Group to render),
   clickables (meshes that advance to the next level on click), optional
   labels ([{anchor:Vector3-in-group-space, text}]), optional toggle(on)
   for the typical/affected state switch, optional setExample(idx) for
   tabbed sub-variants, camPos/camTarget for the default view, and
   update(t) called every frame.
======================================================================= */
var Viewer3D = (function(){
  var hostEl, labelsEl, loadingEl, badgeEl;
  var renderer, camera, scene, controls, raycaster, pointer;
  var currentGroup = null, currentSceneObj = null, currentModel3d = null;
  var clock = new THREE.Clock();
  var ready = false;
  var camAnim = null;
  var pointerDownInfo = null;
  var idleTimer = null;
  var advanceCallback = function(){};

  function easeInOutCubic(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }

  function mulberry32(seed){
    var a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function resize(){
    if(!renderer || !hostEl) return;
    var w = hostEl.clientWidth || 1, h = hostEl.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function init(opts){
    hostEl = opts.hostEl; labelsEl = opts.labelsEl; loadingEl = opts.loadingEl; badgeEl = opts.badgeEl;
    advanceCallback = opts.onAdvance || function(){};
    try{
      renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'low-power'});
    } catch(e){
      return false;
    }
    if(!renderer){ return false; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    hostEl.appendChild(renderer.domElement);

    camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0,0,7);

    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0c0a18, 9, 20);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1330, 1.15));
    var d1 = new THREE.DirectionalLight(0xffffff, 1.0); d1.position.set(4,6,5); scene.add(d1);
    var d2 = new THREE.DirectionalLight(0x8fa8ff, 0.45); d2.position.set(-5,-3,-4); scene.add(d2);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 1.8;
    controls.maxDistance = 22;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.enablePan = false;

    raycaster = new THREE.Raycaster();
    pointer = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointerup', onPointerUp);
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    window.addEventListener('resize', resize);
    if(window.ResizeObserver){
      new ResizeObserver(resize).observe(hostEl);
    }

    resize();
    ready = true;
    if(loadingEl) loadingEl.style.display = 'none';
    animate();
    return true;
  }

  function wakeAutoRotate(){
    controls.autoRotate = false;
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ controls.autoRotate = true; }, 3500);
  }

  function onPointerDown(e){
    pointerDownInfo = {x:e.clientX, y:e.clientY, t:performance.now()};
    wakeAutoRotate();
  }
  function onPointerUp(e){
    if(!pointerDownInfo) return;
    var dx = e.clientX-pointerDownInfo.x, dy = e.clientY-pointerDownInfo.y;
    var dist = Math.sqrt(dx*dx+dy*dy);
    var dt = performance.now()-pointerDownInfo.t;
    pointerDownInfo = null;
    if(dist < 6 && dt < 600){ handleClick(e); }
  }
  function onPointerMove(e){
    if(!currentSceneObj || !currentSceneObj.clickables || !currentSceneObj.clickables.length){
      renderer.domElement.style.cursor = 'grab';
      return;
    }
    setPointerFromEvent(e);
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(currentSceneObj.clickables, true);
    renderer.domElement.style.cursor = hits.length ? 'pointer' : 'grab';
  }
  function setPointerFromEvent(e){
    var rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX-rect.left)/rect.width)*2-1;
    pointer.y = -((e.clientY-rect.top)/rect.height)*2+1;
  }
  function handleClick(e){
    if(!currentSceneObj || !currentSceneObj.clickables || !currentSceneObj.clickables.length) return;
    setPointerFromEvent(e);
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(currentSceneObj.clickables, true);
    if(hits.length && currentModel3d && currentModel3d.canAdvance){
      advanceCallback();
    }
  }

  function disposeObject3D(obj){
    obj.traverse(function(node){
      if(node.geometry) node.geometry.dispose();
      if(node.material){
        var mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach(function(m){
          for(var k in m){ if(m[k] && m[k].isTexture) m[k].dispose(); }
          m.dispose();
        });
      }
    });
  }

  function flyTo(pos, target, duration){
    camAnim = {
      fromPos: camera.position.clone(), fromTarget: controls.target.clone(),
      toPos: pos.clone(), toTarget: target.clone(),
      t0: performance.now(), duration: duration || 950
    };
  }

  function makeHotspot(colorHex, localPos){
    var g = new THREE.Group();
    g.position.copy(localPos);
    var core = new THREE.Mesh(new THREE.SphereGeometry(0.085,16,16), new THREE.MeshBasicMaterial({color:0xffffff}));
    var ring = new THREE.Mesh(new THREE.TorusGeometry(0.17,0.017,8,32), new THREE.MeshBasicMaterial({color:new THREE.Color(colorHex), transparent:true, opacity:0.9}));
    ring.rotation.x = Math.PI/2;
    var ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.17,0.017,8,32), new THREE.MeshBasicMaterial({color:new THREE.Color(colorHex), transparent:true, opacity:0.4}));
    ring2.rotation.x = Math.PI/2;
    g.add(core, ring, ring2);
    g.userData = {core:core, ring:ring, ring2:ring2};
    return g;
  }
  function pulseHotspot(h, t){
    h.userData.ring.scale.setScalar(1+0.22*Math.sin(t*3));
    h.userData.ring2.scale.setScalar(1.5+0.5*Math.sin(t*3+0.7));
    h.userData.ring2.material.opacity = 0.28+0.18*Math.sin(t*3+0.7);
    h.userData.core.scale.setScalar(1+0.35*Math.sin(t*3+1.1));
  }

  /* ---------------- scene builders ---------------- */

  // High-fidelity brain mesh, sourced from NIH 3D (3d.nih.gov) — a real MRI-derived
  // brain surface reconstruction, decimated for the web. Loaded once and cached;
  // every scene that wants it (brain, regions) reuses the same parsed geometry.
  var MODEL_URLS = { brainWhole: './models/brain-whole.glb' };
  var brainGeometryPromise = null;
  function getBrainGeometry(){
    if(!brainGeometryPromise){
      brainGeometryPromise = new Promise(function(resolve, reject){
        new GLTFLoader().load(MODEL_URLS.brainWhole, function(gltf){
          var mesh = null;
          gltf.scene.traverse(function(o){ if(o.isMesh && !mesh) mesh = o; });
          if(!mesh){ reject(new Error('no mesh found in brain-whole.glb')); return; }
          mesh.geometry.center();
          if(!mesh.geometry.attributes.normal) mesh.geometry.computeVertexNormals();
          resolve(mesh.geometry);
        }, undefined, reject);
      });
    }
    return brainGeometryPromise;
  }
  // The source model's local axes don't match our scene's Y-up convention;
  // this rotation + scale, found by visual inspection, orients it correctly.
  var BRAIN_MODEL_ROTATION_X = -Math.PI/2;
  var BRAIN_MODEL_SCALE = 0.024;
  var BRAIN_MODEL_YAW = 0;

  function buildProceduralBrainGeometry(){
    var geo = new THREE.IcosahedronGeometry(1.7, 4);
    var pos = geo.attributes.position, v = new THREE.Vector3();
    for(var i=0;i<pos.count;i++){
      v.fromBufferAttribute(pos, i);
      var n = v.clone().normalize();
      var bump = 0.09*Math.sin(n.x*8+n.y*5) + 0.07*Math.sin(n.y*10+n.z*6) + 0.06*Math.sin(n.z*9+n.x*7);
      var groove = Math.exp(-Math.pow(v.x*3.2,2)) * 0.16;
      var scale = 1+bump-groove;
      v.multiplyScalar(scale);
      pos.setXYZ(i, v.x, v.y*1.03, v.z*0.9);
    }
    geo.computeVertexNormals();
    return geo;
  }

  function buildBrain(level){
    var group = new THREE.Group();
    var cancelled = false;

    // Instant low-poly placeholder shown immediately; swapped out once the
    // real NIH 3D model finishes loading (a few hundred KB, usually well
    // under a second on a local server, but never blocks first paint).
    var placeholderGeo = buildProceduralBrainGeometry();
    var placeholder = new THREE.Mesh(placeholderGeo, new THREE.MeshStandardMaterial({color:0xf0b6a8, roughness:0.68, metalness:0.04}));
    group.add(placeholder);

    var glow = new THREE.Mesh(placeholderGeo.clone(), new THREE.MeshBasicMaterial({color:new THREE.Color(level.color), transparent:true, opacity:0.10, side:THREE.BackSide}));
    glow.scale.setScalar(1.14);
    group.add(glow);

    var hotspot = makeHotspot(level.color, new THREE.Vector3(0.95, 0.25, 1.25));
    group.add(hotspot);

    var brainMesh = placeholder;
    getBrainGeometry().then(function(geo){
      if(cancelled) return;
      var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xf0b6a8, roughness:0.62, metalness:0.03}));
      mesh.rotation.x = BRAIN_MODEL_ROTATION_X;
      mesh.scale.setScalar(BRAIN_MODEL_SCALE);
      group.remove(placeholder);
      disposeObject3D(placeholder);
      group.add(mesh);
      group.remove(glow);
      disposeObject3D(glow);
      brainMesh = mesh;
    }).catch(function(err){
      console.warn('High-fidelity brain model failed to load; keeping stylized placeholder.', err);
    });

    return {
      group: group,
      clickables: [group],
      camPos: new THREE.Vector3(0, 0.35, 6.4),
      camTarget: new THREE.Vector3(0,0,0),
      onDispose: function(){ cancelled = true; },
      update: function(t){ brainMesh.rotation.y = BRAIN_MODEL_YAW + Math.sin(t*0.05)*0.03; pulseHotspot(hotspot, t); }
    };
  }

  function regionColor(id, model3d, fallback){
    var r = model3d && model3d.regions && model3d.regions.filter(function(x){return x.id===id;})[0];
    return (r && r.color) || fallback;
  }

  function buildRegions(level, model3d){
    var group = new THREE.Group();
    var clickables = [group], labels = [];
    var cancelled = false;

    var shellPlaceholderGeo = buildProceduralBrainGeometry();
    var shell = new THREE.Mesh(shellPlaceholderGeo, new THREE.MeshStandardMaterial({color:0xe7d9ff, transparent:true, opacity:0.14, roughness:1, side:THREE.DoubleSide}));
    group.add(shell);

    getBrainGeometry().then(function(geo){
      if(cancelled) return;
      var hiFiShell = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xe7d9ff, transparent:true, opacity:0.13, roughness:1, side:THREE.DoubleSide}));
      hiFiShell.rotation.x = BRAIN_MODEL_ROTATION_X;
      hiFiShell.rotation.y = Math.PI;
      hiFiShell.scale.setScalar(BRAIN_MODEL_SCALE);
      group.remove(shell);
      disposeObject3D(shell);
      group.add(hiFiShell);
      shell = hiFiShell;
    }).catch(function(err){
      console.warn('High-fidelity brain shell failed to load; keeping stylized placeholder.', err);
    });

    var hippoColor = regionColor('hippocampus', model3d, '#f59e0b');
    var hippoPts = [
      new THREE.Vector3(0.72,-0.2,0.55), new THREE.Vector3(0.95,-0.05,0.15),
      new THREE.Vector3(0.85,0.1,-0.25), new THREE.Vector3(0.55,0.05,-0.5),
      new THREE.Vector3(0.28,-0.1,-0.55)
    ];
    var hippoCurve = new THREE.CatmullRomCurve3(hippoPts);
    var hippoMat = new THREE.MeshStandardMaterial({color:new THREE.Color(hippoColor), roughness:0.4, emissive:new THREE.Color(hippoColor), emissiveIntensity:0.18});
    var hippoMesh = new THREE.Mesh(new THREE.TubeGeometry(hippoCurve, 40, 0.09, 10, false), hippoMat);
    group.add(hippoMesh); clickables.push(hippoMesh);
    labels.push({anchor:new THREE.Vector3(0.85,0.2,-0.25), text:'Hippocampus'});
    var hippoMesh2 = hippoMesh.clone(); hippoMesh2.scale.x = -1; group.add(hippoMesh2); clickables.push(hippoMesh2);

    var cortexColor = regionColor('cortex', model3d, '#14b8a6');
    var cap = new THREE.Mesh(
      new THREE.SphereGeometry(1.78, 24, 24, 0, Math.PI*0.7, 0, Math.PI*0.5),
      new THREE.MeshStandardMaterial({color:new THREE.Color(cortexColor), roughness:0.5, transparent:true, opacity:0.88, emissive:new THREE.Color(cortexColor), emissiveIntensity:0.12})
    );
    cap.rotation.set(0.3, -0.5, 0);
    group.add(cap); clickables.push(cap);
    labels.push({anchor:new THREE.Vector3(-0.35,1.35,0.95), text:'Cortex (layer 2/3)'});

    var cbColor = regionColor('cerebellum', model3d, '#9ca3af');
    var cb = new THREE.Mesh(new THREE.SphereGeometry(0.55,16,12), new THREE.MeshStandardMaterial({color:new THREE.Color(cbColor), roughness:0.9}));
    cb.position.set(-0.1,-0.9,-1.4); cb.scale.set(1.3,0.8,0.9);
    group.add(cb); clickables.push(cb);
    labels.push({anchor:new THREE.Vector3(-0.1,-0.9,-1.4), text:'Cerebellum'});

    var hotspot = makeHotspot(level.color, new THREE.Vector3(0,-1.6,1.35));
    group.add(hotspot); clickables.push(hotspot);

    return {
      group: group, clickables: clickables, labels: labels,
      camPos: new THREE.Vector3(1.3,0.6,5.7), camTarget: new THREE.Vector3(0,0,0),
      onDispose: function(){ cancelled = true; },
      update: function(t){
        pulseHotspot(hotspot, t);
        var e = 0.18+0.1*Math.sin(t*2);
        hippoMesh.material.emissiveIntensity = e; hippoMesh2.material.emissiveIntensity = e;
      }
    };
  }

  function buildCircuits(level){
    var group = new THREE.Group();
    var rng = mulberry32(42);
    var N = 14, nodes = [];
    for(var i=0;i<N;i++){
      var theta = rng()*Math.PI*2, phi = Math.acos(2*rng()-1), r = 1.1+rng()*0.9;
      var p = new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta)*0.7, r*Math.cos(phi));
      var mat = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0x332244, emissiveIntensity:0.3});
      var mesh = new THREE.Mesh(new THREE.SphereGeometry(0.11,14,14), mat);
      mesh.position.copy(p);
      group.add(mesh);
      nodes.push({mesh:mesh, pos:p});
    }
    var edges = [];
    for(var i=0;i<N;i++){
      var dists = [];
      for(var j=0;j<N;j++){ if(i!==j) dists.push({j:j, d:nodes[i].pos.distanceTo(nodes[j].pos)}); }
      dists.sort(function(a,b){return a.d-b.d;});
      var linkCount = 2+Math.floor(rng()*2);
      for(var k=0;k<linkCount;k++){
        var j = dists[k].j;
        var key = i<j ? i+'-'+j : j+'-'+i;
        if(edges.some(function(e){return e.key===key;})) continue;
        var excitatory = rng() < 0.8;
        var mid = nodes[i].pos.clone().lerp(nodes[j].pos,0.5).multiplyScalar(1.15);
        var curve = new THREE.QuadraticBezierCurve3(nodes[i].pos, mid, nodes[j].pos);
        var geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(20));
        var baseColor = excitatory ? 0xf97316 : 0x38bdf8;
        var line = new THREE.Line(geo, new THREE.LineBasicMaterial({color:baseColor, transparent:true, opacity:0.55}));
        group.add(line);
        var particle = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8), new THREE.MeshBasicMaterial({color:baseColor}));
        group.add(particle);
        edges.push({key:key, curve:curve, particle:particle, baseSpeed:0.25+rng()*0.2, phase:rng()});
      }
    }
    var hotspot = makeHotspot(level.color, new THREE.Vector3(0,0,2.15));
    group.add(hotspot);

    var affected = false;
    function setState(on){
      affected = on;
      edges.forEach(function(e){ e.speed = on ? e.baseSpeed*2.4 : e.baseSpeed; });
      nodes.forEach(function(n){
        n.mesh.material.emissive.set(on ? 0xff3355 : 0x332244);
        n.mesh.material.emissiveIntensity = on ? 0.7 : 0.3;
      });
    }
    edges.forEach(function(e){ e.speed = e.baseSpeed; });

    return {
      group: group,
      clickables: nodes.map(function(n){return n.mesh;}).concat([hotspot]),
      camPos: new THREE.Vector3(0,0.3,5.3), camTarget: new THREE.Vector3(0,0,0),
      toggle: setState,
      update: function(t){
        pulseHotspot(hotspot, t);
        edges.forEach(function(e){
          var tt = (t*e.speed+e.phase) % 1;
          e.particle.position.copy(e.curve.getPoint(tt));
        });
      }
    };
  }

  function buildNeuron(level){
    var group = new THREE.Group();
    var rng = mulberry32(123);
    group.add(new THREE.Mesh(new THREE.SphereGeometry(0.35,20,20), new THREE.MeshStandardMaterial({color:0xffb4a2, roughness:0.5})));

    var spineMeshes = [];
    function branch(origin, dir, len, radius, depth){
      if(depth<=0 || len<0.05) return;
      var pts = [origin.clone()], cur = origin.clone(), d = dir.clone();
      for(var s=0;s<3;s++){
        d.x += (rng()-0.5)*0.5; d.y += (rng()-0.5)*0.5; d.z += (rng()-0.5)*0.5; d.normalize();
        cur = cur.clone().add(d.clone().multiplyScalar(len/3));
        pts.push(cur.clone());
      }
      var curve = new THREE.CatmullRomCurve3(pts);
      var mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 8, Math.max(radius,0.015), 6, false), new THREE.MeshStandardMaterial({color:0xffd6c9, roughness:0.6}));
      group.add(mesh);
      if(depth<=2){
        for(var i=0;i<2;i++){
          var tt = 0.3+rng()*0.6;
          var spine = new THREE.Mesh(new THREE.SphereGeometry(0.028,6,6), new THREE.MeshStandardMaterial({color:0xfca5a5}));
          spine.position.copy(curve.getPoint(tt));
          spine.userData.depth = depth;
          spine.visible = false;
          group.add(spine);
          spineMeshes.push(spine);
        }
      }
      var branches = depth>1 ? 2 : 0;
      for(var b=0;b<branches;b++){
        var nd = d.clone();
        nd.x += (rng()-0.5)*0.9; nd.y += (rng()-0.5)*0.9; nd.z += (rng()-0.5)*0.9; nd.normalize();
        branch(cur, nd, len*0.68, radius*0.65, depth-1);
      }
    }
    var roots = 5;
    for(var i=0;i<roots;i++){
      var theta = (i/roots)*Math.PI*2 + rng();
      var dir = new THREE.Vector3(Math.cos(theta), 0.4+rng()*0.6, Math.sin(theta)).normalize();
      branch(dir.clone().multiplyScalar(0.35), dir, 0.9, 0.06, 3);
    }

    var axonDir = new THREE.Vector3(0,-1,0.2).normalize();
    var axonPts = [new THREE.Vector3(0,-0.35,0)], cur = axonPts[0].clone();
    for(var s=0;s<5;s++){
      cur = cur.clone().add(axonDir.clone().multiplyScalar(0.5)).add(new THREE.Vector3((rng()-0.5)*0.15,0,(rng()-0.5)*0.15));
      axonPts.push(cur.clone());
    }
    var axonCurve = new THREE.CatmullRomCurve3(axonPts);
    var axon = new THREE.Mesh(new THREE.TubeGeometry(axonCurve, 30, 0.045, 8, false), new THREE.MeshStandardMaterial({color:0x93c5fd, roughness:0.5}));
    group.add(axon);
    var boutons = [];
    for(var i=0;i<3;i++){
      var b = new THREE.Mesh(new THREE.SphereGeometry(0.06,10,10), new THREE.MeshStandardMaterial({color:0x60a5fa, emissive:0x1e40af, emissiveIntensity:0.3}));
      b.position.copy(axonCurve.getPoint(0.82+i*0.06));
      group.add(b); boutons.push(b);
    }

    function setSpineState(premature){
      spineMeshes.forEach(function(sp){
        if(premature){ sp.visible = true; sp.scale.setScalar(1.15); }
        else { sp.visible = sp.userData.depth === 1; sp.scale.setScalar(0.8); }
      });
    }
    setSpineState(false);

    var hotspot = makeHotspot(level.color, new THREE.Vector3(1.05,0.55,0.55));
    group.add(hotspot);

    return {
      group: group,
      clickables: [group.children[0], axon, hotspot],
      camPos: new THREE.Vector3(0,0.15,4.7), camTarget: new THREE.Vector3(0,-0.2,0),
      toggle: setSpineState,
      update: function(t){
        pulseHotspot(hotspot, t);
        boutons.forEach(function(b,i){ b.material.emissiveIntensity = 0.3+0.4*Math.abs(Math.sin(t*2+i)); });
      }
    };
  }

  function buildSynapse(level){
    var group = new THREE.Group();
    var rng = mulberry32(77);

    var pre = new THREE.Mesh(
      new THREE.SphereGeometry(0.55,24,24, 0, Math.PI*2, 0, Math.PI*0.65),
      new THREE.MeshStandardMaterial({color:0x93c5fd, roughness:0.5, side:THREE.DoubleSide})
    );
    pre.rotation.x = Math.PI; pre.position.set(-1.1,0.3,0);
    group.add(pre);

    var vesicles = [];
    for(var i=0;i<10;i++){
      var vmesh = new THREE.Mesh(new THREE.SphereGeometry(0.06,10,10), new THREE.MeshStandardMaterial({color:0xfacc15, emissive:0x854d0e, emissiveIntensity:0.2}));
      var a = rng()*Math.PI*2, r = 0.15+rng()*0.25;
      vmesh.position.set(-1.1+Math.cos(a)*r, 0.15+rng()*0.3, Math.sin(a)*r);
      vmesh.userData.t = rng(); vmesh.userData.base = vmesh.position.clone(); vmesh.userData.idx = i;
      group.add(vmesh); vesicles.push(vmesh);
    }

    var post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.9,0.9,1.6,24,1,true,Math.PI*0.7,Math.PI*0.6),
      new THREE.MeshStandardMaterial({color:0xc4b5fd, roughness:0.6, side:THREE.DoubleSide})
    );
    post.rotation.z = Math.PI/2; post.position.set(1.0,0,0);
    group.add(post);

    var receptors = [];
    var cols=4, rows=4;
    for(var c=0;c<cols;c++){
      for(var r=0;r<rows;r++){
        var rmesh = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.06,0.22,8), new THREE.MeshStandardMaterial({color:0x22c55e}));
        rmesh.rotation.z = Math.PI/2;
        rmesh.position.set(0.82, -0.45+r*0.3, -0.45+c*0.3);
        rmesh.visible = false;
        group.add(rmesh); receptors.push(rmesh);
      }
    }
    function setReceptorState(excess){
      var activeCount = excess ? receptors.length : Math.round(receptors.length*0.45);
      receptors.forEach(function(r,i){ r.visible = i<activeCount; });
    }
    setReceptorState(false);

    var hotspot = makeHotspot(level.color, new THREE.Vector3(0,-1.1,0.6));
    group.add(hotspot);

    return {
      group: group,
      clickables: [pre, post, hotspot],
      camPos: new THREE.Vector3(0,0.1,4.5), camTarget: new THREE.Vector3(0,-0.1,0),
      toggle: setReceptorState,
      update: function(t){
        pulseHotspot(hotspot, t);
        vesicles.forEach(function(v){
          var cycle = (t*0.3+v.userData.t) % 1;
          if(cycle > 0.85){
            var k = (cycle-0.85)/0.15;
            v.position.x = v.userData.base.x + k*2.05;
            v.material.transparent = true; v.material.opacity = 1-k;
          } else {
            v.position.x = v.userData.base.x + Math.cos(t*0.5+v.userData.idx)*0.03;
            v.material.transparent = false; v.material.opacity = 1;
          }
        });
      }
    };
  }

  function buildProtein(level, model3d){
    var group = new THREE.Group();
    var domains = (model3d && model3d.domains) || [];
    var total = (model3d && model3d.proteinLength) || 1343;
    var N = 220, pts = [];
    for(var i=0;i<=N;i++){
      var u = i/N, ang = u*Math.PI*6, r = 1.2;
      pts.push(new THREE.Vector3(Math.cos(ang)*r*(0.5+0.5*u), (u-0.5)*3.3, Math.sin(ang)*r*(0.5+0.5*u)));
    }
    var baseMesh = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 220, 0.045, 8, false),
      new THREE.MeshStandardMaterial({color:0xd1d5db, roughness:0.6})
    );
    group.add(baseMesh);

    var labels = [], segMeshes = [];
    domains.forEach(function(d){
      var u0 = Math.max(0, d.start/total), u1 = Math.min(1, d.end/total);
      var i0 = Math.floor(u0*N), i1 = Math.ceil(u1*N);
      var segPts = pts.slice(Math.max(0,i0), Math.min(N,i1)+1);
      if(segPts.length < 2) return;
      var curve = new THREE.CatmullRomCurve3(segPts);
      var mesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, Math.max(8,segPts.length), 0.09, 10, false),
        new THREE.MeshStandardMaterial({color:new THREE.Color(d.color), roughness:0.45, emissive:new THREE.Color(d.color), emissiveIntensity:0.2})
      );
      group.add(mesh); segMeshes.push(mesh);
      labels.push({anchor: segPts[Math.floor(segPts.length/2)].clone(), text: d.name});
    });

    var hotspot = makeHotspot(level.color, new THREE.Vector3(0,1.95,0.5));
    group.add(hotspot);

    return {
      group: group,
      clickables: segMeshes.concat([baseMesh, hotspot]),
      labels: labels,
      camPos: new THREE.Vector3(2.5,0.3,3.5), camTarget: new THREE.Vector3(0,0,0),
      update: function(t){ pulseHotspot(hotspot, t); group.rotation.y = t*0.05; }
    };
  }

  function buildAminoAcid(level, model3d){
    var group = new THREE.Group();
    var examples = (model3d && model3d.examples) || [{id:'glycine',name:'Glycine',hasSulfur:false}];
    var CPK = { C:0x6b7280, H:0xf3f4f6, N:0x3b82f6, O:0xef4444, S:0xeab308 };
    var allAtoms = [];

    function atom(elem, p, radius){
      var m = new THREE.Mesh(new THREE.SphereGeometry(radius,20,20), new THREE.MeshStandardMaterial({color:CPK[elem], roughness:0.35, metalness:0.05}));
      m.position.copy(p);
      group.add(m); allAtoms.push(m);
      return m;
    }
    function bond(a,b){
      var dir = new THREE.Vector3().subVectors(b,a), len = dir.length();
      var m = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,len,8), new THREE.MeshStandardMaterial({color:0xcbd5e1, roughness:0.6}));
      m.position.copy(a).add(dir.clone().multiplyScalar(0.5));
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
      group.add(m);
      return m;
    }

    var pCA = new THREE.Vector3(0,0,0);
    var pN  = new THREE.Vector3(-0.9,0.55,0.2);
    var pC  = new THREE.Vector3(0.9,0.5,-0.2);
    var pO1 = new THREE.Vector3(1.6,1.1,-0.5);
    var pO2 = new THREE.Vector3(1.1,-0.4,-0.6);
    var pH  = new THREE.Vector3(0.1,-0.2,1.0);
    var pHN1= new THREE.Vector3(-1.6,0.2,0.5);
    var pHN2= new THREE.Vector3(-1.0,1.3,0.6);
    var pR  = new THREE.Vector3(-0.3,-0.5,-1.1);
    var pRS = new THREE.Vector3(-0.9,-1.3,-1.7);

    atom('C', pCA, 0.22); atom('N', pN, 0.20); atom('C', pC, 0.20);
    atom('O', pO1, 0.18); atom('O', pO2, 0.18); atom('H', pH, 0.11);
    atom('H', pHN1, 0.10); atom('H', pHN2, 0.10);
    bond(pCA,pN); bond(pCA,pC); bond(pC,pO1); bond(pC,pO2); bond(pCA,pH); bond(pN,pHN1); bond(pN,pHN2);

    var dynamic = [];
    function clearDynamic(){ dynamic.forEach(function(o){ group.remove(o); var idx=allAtoms.indexOf(o); if(idx>=0) allAtoms.splice(idx,1); }); dynamic = []; }
    function buildRGroup(ex){
      clearDynamic();
      if(ex && ex.hasSulfur){
        var rC = atom('C', pR, 0.19); dynamic.push(rC);
        var rS = atom('S', pRS, 0.22); dynamic.push(rS);
        var hR1 = atom('H', pR.clone().add(new THREE.Vector3(0.35,0.35,0)), 0.09); dynamic.push(hR1);
        dynamic.push(bond(pCA,pR)); dynamic.push(bond(pR,pRS)); dynamic.push(bond(pR,hR1.position));
      } else {
        var hR = atom('H', pR, 0.13); dynamic.push(hR);
        dynamic.push(bond(pCA,pR));
      }
    }
    buildRGroup(examples[0]);

    var hotspot = makeHotspot(level.color, new THREE.Vector3(0,1.6,0.8));
    group.add(hotspot);

    return {
      group: group,
      clickables: allAtoms.concat([hotspot]),
      camPos: new THREE.Vector3(0.4,0.2,4.3), camTarget: new THREE.Vector3(0,0,-0.2),
      setExample: function(idx){ buildRGroup(examples[idx]); this.clickables = allAtoms.concat([hotspot]); },
      update: function(t){ pulseHotspot(hotspot, t); group.rotation.y = t*0.15; }
    };
  }

  function buildElements(level, model3d){
    var group = new THREE.Group();
    var items = (model3d && model3d.items) || [];
    var nucleusGroup = new THREE.Group(), shellsGroup = new THREE.Group();
    group.add(nucleusGroup, shellsGroup);
    var electronMeshes = [];

    function buildElement(idx){
      nucleusGroup.clear(); shellsGroup.clear(); electronMeshes = [];
      var el = items[idx]; if(!el) return;
      var rng = mulberry32(el.atomicNumber*13+7);
      var nucleons = el.protons+el.neutrons;
      var nucleusRadius = 0.3+Math.min(nucleons,40)*0.006;
      for(var i=0;i<Math.min(nucleons,40);i++){
        var isProton = i<el.protons;
        var a=rng()*Math.PI*2, b=rng()*Math.PI*2, r=rng()*nucleusRadius*0.85;
        var p = new THREE.Vector3(Math.cos(a)*Math.sin(b)*r, Math.sin(a)*Math.sin(b)*r, Math.cos(b)*r);
        var m = new THREE.Mesh(new THREE.SphereGeometry(0.115,10,10), new THREE.MeshStandardMaterial({color:isProton?0xef4444:0x9ca3af, roughness:0.4}));
        m.position.copy(p);
        nucleusGroup.add(m);
      }
      el.shells.forEach(function(count, si){
        var radius = 0.9+si*0.65;
        var ring = new THREE.Mesh(new THREE.TorusGeometry(radius,0.006,8,64), new THREE.MeshBasicMaterial({color:0x93c5fd, transparent:true, opacity:0.35}));
        ring.rotation.x = Math.PI/2+si*0.35;
        shellsGroup.add(ring);
        for(var e=0;e<count;e++){
          var ang = (e/count)*Math.PI*2;
          var em = new THREE.Mesh(new THREE.SphereGeometry(0.07,10,10), new THREE.MeshStandardMaterial({color:0x60a5fa, emissive:0x1d4ed8, emissiveIntensity:0.5}));
          shellsGroup.add(em);
          electronMeshes.push({mesh:em, radius:radius, angle0:ang, tilt:si*0.35, speed:0.5-si*0.08});
        }
      });
    }
    buildElement(1);

    return {
      group: group,
      clickables: [],
      camPos: new THREE.Vector3(0,0.3,5.4), camTarget: new THREE.Vector3(0,0,0),
      setExample: function(idx){ buildElement(idx); },
      update: function(t){
        electronMeshes.forEach(function(e){
          var ang = e.angle0+t*e.speed;
          e.mesh.position.set(Math.cos(ang)*e.radius, Math.sin(ang)*e.radius*Math.sin(e.tilt), Math.sin(ang)*e.radius*Math.cos(e.tilt));
        });
      }
    };
  }

  var builders = {
    brain: function(level, m){ return buildBrain(level); },
    regions: function(level, m){ return buildRegions(level, m); },
    circuits: function(level, m){ return buildCircuits(level); },
    neuron: function(level, m){ return buildNeuron(level); },
    synapse: function(level, m){ return buildSynapse(level); },
    protein: function(level, m){ return buildProtein(level, m); },
    'amino-acid': function(level, m){ return buildAminoAcid(level, m); },
    elements: function(level, m){ return buildElements(level, m); }
  };

  /* ---------------- controls UI (toggle switch / tab buttons) ---------------- */

  function renderControls(level, sceneObj){
    var controlsEl = document.getElementById('viewerControls');
    controlsEl.innerHTML = '';
    var m = level.model3d || {};

    if(sceneObj.toggle && m.toggle){
      var wrap = document.createElement('div');
      wrap.className = 'vc-toggle';
      wrap.innerHTML = '<span class="offlabel">' + escapeHtml(m.toggle.offLabel) + '</span><span class="dot"></span><span class="onlabel">' + escapeHtml(m.toggle.onLabel) + '</span>';
      var on = false;
      wrap.addEventListener('click', function(){
        on = !on;
        wrap.classList.toggle('on', on);
        sceneObj.toggle(on);
      });
      controlsEl.appendChild(wrap);
    }

    if(sceneObj.setExample && m.type === 'amino-acid'){
      (m.examples||[]).forEach(function(ex, idx){
        var b = document.createElement('button');
        b.className = 'vc-btn' + (idx===0?' active':'');
        b.type = 'button';
        b.textContent = ex.name;
        b.addEventListener('click', function(){
          Array.prototype.forEach.call(controlsEl.querySelectorAll('.vc-btn'), function(x){x.classList.remove('active');});
          b.classList.add('active');
          sceneObj.setExample(idx);
        });
        controlsEl.appendChild(b);
      });
    }

    if(sceneObj.setExample && m.type === 'elements'){
      (m.items||[]).forEach(function(el, idx){
        var b = document.createElement('button');
        b.className = 'vc-btn' + (idx===1?' active':'');
        b.type = 'button';
        b.textContent = el.symbol;
        b.title = el.name;
        b.addEventListener('click', function(){
          Array.prototype.forEach.call(controlsEl.querySelectorAll('.vc-btn'), function(x){x.classList.remove('active');});
          b.classList.add('active');
          sceneObj.setExample(idx);
        });
        controlsEl.appendChild(b);
      });
    }
  }

  /* ---------------- label overlay ---------------- */

  function updateLabels(){
    if(!labelsEl) return;
    var labels = (currentSceneObj && currentSceneObj.labels) || [];
    while(labelsEl.children.length < labels.length){
      var d = document.createElement('div'); d.className = 'viewer-label'; labelsEl.appendChild(d);
    }
    while(labelsEl.children.length > labels.length){ labelsEl.removeChild(labelsEl.lastChild); }
    if(!labels.length || !currentGroup) return;
    var rect = renderer.domElement.getBoundingClientRect();
    labels.forEach(function(l, i){
      var el = labelsEl.children[i];
      el.textContent = l.text;
      var world = currentGroup.localToWorld(l.anchor.clone());
      var ndc = world.project(camera);
      if(ndc.z > 1 || ndc.z < -1){ el.style.display = 'none'; return; }
      el.style.display = 'block';
      var x = (ndc.x*0.5+0.5)*rect.width;
      var y = (1-(ndc.y*0.5+0.5))*rect.height;
      el.style.transform = 'translate(-50%, -125%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    });
  }

  /* ---------------- public: load a level's scene ---------------- */

  function loadLevel(level){
    if(!ready) return;
    if(currentSceneObj && currentSceneObj.onDispose){ currentSceneObj.onDispose(); }
    if(currentGroup){ scene.remove(currentGroup); disposeObject3D(currentGroup); }
    currentGroup = null; currentSceneObj = null;

    var m = level.model3d || {};
    var builder = builders[m.type];
    if(!builder){ if(badgeEl) badgeEl.style.display='none'; return; }
    if(badgeEl) badgeEl.style.display='inline-block';

    var built = builder(level, m);
    currentGroup = built.group;
    currentSceneObj = built;
    currentModel3d = { canAdvance: !!level.childId };
    scene.add(currentGroup);
    scene.fog.color.set(0x0c0a18);

    flyTo(built.camPos, built.camTarget, 950);
    controls.autoRotate = true;

    renderControls(level, built);

    if(viewerInstructionsEl){
      viewerInstructionsEl.textContent = level.childId
        ? '🖱️ Drag to rotate • Scroll to zoom • Click the glowing marker to zoom in'
        : '🖱️ Drag to rotate • Scroll to zoom — smallest scale reached';
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    var dt = clock.getDelta(), t = clock.elapsedTime;
    if(camAnim){
      var e = Math.min(1, (performance.now()-camAnim.t0)/camAnim.duration);
      var k = easeInOutCubic(e);
      camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, k);
      controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, k);
      if(e>=1) camAnim = null;
    }
    if(currentSceneObj && currentSceneObj.update) currentSceneObj.update(t, dt);
    controls.update();
    updateLabels();
    renderer.render(scene, camera);
  }

  return { init: init, loadLevel: loadLevel };
})();

/* ---------------- boot ---------------- */

if(levels.length){
  renderFooter();
  var viewerOk = false;
  try{
    viewerOk = Viewer3D.init({
      hostEl: document.getElementById('viewerHost'),
      labelsEl: document.getElementById('viewerLabels'),
      loadingEl: document.getElementById('viewerLoading'),
      badgeEl: document.getElementById('viewerBadge'),
      onAdvance: function(){ goTo(current+1); }
    });
  } catch(e){ viewerOk = false; console.error('3D viewer failed to start', e); }

  if(!viewerOk){
    var wrap = document.getElementById('viewerWrap');
    wrap.innerHTML = '<div class="viewer-fallback"><div class="big">🧠</div><div>3D preview isn\'t available in this browser.<br>Use the buttons and level map below to navigate instead.</div></div>';
  }

  goTo(0);
} else {
  cardEl.innerHTML = '<p style="color:#c00;">Could not load app data.</p>';
}

window.__syngapBooted = true;
</script>
<script>
// Classic (non-module) safety net: ES module <script> tags cannot load at all
// over the file:// protocol in Chrome/Edge (a browser security restriction,
// not a bug in this app), which would otherwise leave a blank "Loading…" page
// with no explanation. If the module above hasn't finished booting after a
// couple of seconds, replace the page with clear instructions instead of
// leaving it stuck. Firefox and any http(s)-served page are unaffected.
setTimeout(function(){
  if(window.__syngapBooted) return;
  var wrap = document.getElementById('viewerWrap');
  if(wrap) wrap.style.display = 'none';
  var card = document.getElementById('card');
  if(card){
    card.innerHTML =
      '<div style="text-align:center;padding:20px 10px;">' +
      '<div style="font-size:2.4rem;margin-bottom:10px;">🧠</div>' +
      '<h2 style="margin:0 0 10px;">This app needs to be served over a local web server</h2>' +
      '<p style="color:#5b5470;max-width:520px;margin:0 auto 16px;line-height:1.6;">' +
      'The 3D viewer uses JavaScript modules, which Chrome and Edge block when a file is opened directly from disk (a file:// address). ' +
      'This is a one-time setup — from a terminal, in the folder with these files, run:</p>' +
      '<pre style="background:#f2effc;padding:14px 18px;border-radius:10px;display:inline-block;text-align:left;font-size:0.9rem;">cd path/to/this/folder\npython3 -m http.server 8000</pre>' +
      '<p style="color:#5b5470;max-width:520px;margin:16px auto 0;line-height:1.6;">Then open <strong>http://localhost:8000</strong> in your browser. ' +
      'See the included README for details, or try Firefox, which can often run this app directly from disk.</p>' +
      '</div>';
  }
}, 2200);
</script>
